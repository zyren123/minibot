# Minibot Default Configuration

# Skills directory (relative to this config file directory when not absolute).
skills_dir: skills

# LLM configuration
llm:
  # Use environment variables: OPENAI_BASE_URL, OPENAI_API_KEY, MODEL_ID
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  model: ${MODEL_ID:gpt-4.1-mini}
  max_tokens: 8000

# Tools configuration
tools:
  enabled:
    - "*"  # Enable all tools
  disabled: []
  timeout: 60

# Agent teams configuration
teams:
  enabled: true
  max_members: 6
  default_members: 3
  log_dir: .minibot/teams
  wait_timeout_sec: 30
  quiet_teammates: true
