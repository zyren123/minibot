# Minibot Default Configuration

# Skills directory (relative to this config file directory when not absolute).
skills_dir: ../skills

# LLM configuration
llm:
  # Use environment variables: OPENAI_BASE_URL, OPENAI_API_KEY, MODEL_ID
  base_url: ${OPENAI_BASE_URL}
  api_key: ${OPENAI_API_KEY}
  model: ${MODEL_ID:gpt-4.1-mini}
  max_tokens: 8000
  stream_enabled: true

# Tools configuration
runtime_budget:
  max_llm_calls: 30
  max_tool_calls: 100
  max_wall_time: 600
  max_input_tokens: 200000
  max_output_tokens: 50000

tools:
  enabled:
    - "*"  # Enable all tools
  disabled: []
  timeout: 60
  bash:
    backend: local
    image: debian:bookworm
    memory_mb: 512
    cpus: 1.0
    pids_limit: 128

# Agent teams configuration
teams:
  enabled: true
  max_members: 6
  default_members: 3
  log_dir: .minibot/teams
  wait_timeout_sec: 30
  quiet_teammates: true
  debug_teammate_output: false
