# MCP Servers Configuration

enabled: true

servers:
  # Example: Context7 documentation server
  - name: context7
    transport: stdio
    command: npx
    args:
      - -y
      - "@upstash/context7-mcp"
    enabled: true

  # DuckDuckGo search server (duckduckgo-mcp-server)
  - name: duckduckgo
    transport: stdio
    command: uvx
    args:
      - duckduckgo-mcp-server
    enabled: true

  # Example: Novel Memo Agent tools backed by an existing Markdown vault.
  # Use this standalone server when MiniBot's built-in memory is disabled.
  # Novel Memo 0.2.1 uses the MCP Python SDK 1.x FastMCP API.
  # - name: novelmemo
  #   transport: stdio
  #   command: uvx
  #   args: ["--from", "novelmemo==0.2.1", "--with", "mcp<2", "novelmemo", "mcp", "--vault", "/absolute/path/to/vault"]
  #   enabled: true

  # Example: Local file server
  # - name: filesystem
  #   transport: stdio
  #   command: npx
  #   args:
  #     - -y
  #     - "@anthropic/mcp-server-filesystem"
  #     - /path/to/allowed/directory
  #   enabled: true

  # Example: Remote SSE server
  # - name: remote-api
  #   transport: sse
  #   url: https://api.example.com/mcp
  #   enabled: false

