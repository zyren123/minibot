[project]
name = "minibot"
version = "0.1.0"
description = "A modular Claude Code clone with MCP client and Hooks system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "rich>=13.7.0",
]

[project.scripts]
minibot = "minibot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minibot"]
