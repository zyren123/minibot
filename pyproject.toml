[project]
name = "minibotclaw"
version = "0.1.7"
description = "A minimal, framework-free AI agent toolkit for learning, local automation, and MCP-powered workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "zyren123" },
]
keywords = [
    "agent",
    "ai-agent",
    "mcp",
    "openai",
    "python",
    "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=2.16.0,<3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "psycopg[binary]>=3.2.9",
    "sqlmodel>=0.0.22",
    "lark-oapi>=1.5.3",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=1.6.5",
]

[project.scripts]
minibot = "minibot.main:main"
minibot-web = "minibot.server.cli:main"

[project.urls]
Homepage = "https://github.com/zyren123/minibot"
Repository = "https://github.com/zyren123/minibot"
Issues = "https://github.com/zyren123/minibot/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/minibot/server/static/**", "src/minibot/builtin_skills/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/minibot"]

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "src/minibot/**",
    "webui/**",
    "README.md",
    "docs/**",
    "config/**",
    "hooks/**",
    "skills/**",
    "examples/**",
    "tests/**",
]
