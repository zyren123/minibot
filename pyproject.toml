[project]
name = "minibot"
version = "0.1.0"
description = "A assistant for education purpose"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.16.0,<3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=1.6.5",
]

[project.scripts]
minibot = "minibot.main:main"
minibot-web = "minibot.server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minibot"]
include = ["src/minibot/server/static/**"]

[tool.hatch.build.targets.sdist]
include = [
    "src/minibot/**",
    "webui/**",
    "README.md",
    "docs/**",
    "config/**",
    "hooks/**",
    "skills/**",
    "examples/**",
    "tests/**",
]
