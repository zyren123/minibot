[project]
name = "minibot"
version = "0.1.0"
description = "A assistant for education purpose"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "httpx>=0.25.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.0",
]

[project.scripts]
minibot = "minibot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minibot"]
