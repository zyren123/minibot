name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build WebUI
        working-directory: webui
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Copy WebUI dist into Python package
        run: |
          rm -rf src/minibot/server/static/*
          cp -R webui/dist/* src/minibot/server/static/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest pytest-asyncio
          python -m pip install .

      - name: Run tests
        run: pytest -q

      - name: Build wheel/sdist (sanity)
        run: python -m build
