name: publish-pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build WebUI
        working-directory: webui
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Sync WebUI dist into Python package
        run: bash scripts/sync_webui_static.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PYPROJECT_VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject.toml version: ${PYPROJECT_VERSION}"
          echo "git tag version:      ${TAG_VERSION}"
          test "${PYPROJECT_VERSION}" = "${TAG_VERSION}"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest pytest-asyncio
          python -m pip install .

      - name: Run tests
        run: pytest -q

      - name: Build wheel/sdist
        run: python -m build

      - name: Verify packaged WebUI assets
        run: python scripts/verify_package_static.py dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI (API token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}

      - name: Publish to PyPI (Trusted Publishing)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release and upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
