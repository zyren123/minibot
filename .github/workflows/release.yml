name: build-release

on:
  release:
    types: [created]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build WebUI
        working-directory: webui
        run: |
          npm install --no-fund --no-audit
          npm run build

      - name: Copy WebUI dist into Python package
        run: |
          rm -rf src/minibot/server/static/*
          cp -R webui/dist/* src/minibot/server/static/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel/sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
